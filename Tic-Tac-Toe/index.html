<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts: Orbitron (display) + Rajdhani (body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ========== BACKGROUND GRID EFFECT ========== -->
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- ========== MAIN GAME CARD ========== -->
    <main class="game-card">
      <!-- Title -->
      <header class="game-header">
        <h1 class="game-title">TIC<span>TAC</span>TOE</h1>
        <p class="game-subtitle">Neon Arena</p>
      </header>

      <!-- Mode Toggle -->
      <div class="mode-toggle" role="group" aria-label="Game mode">
        <button
          id="btn-two-player"
          class="mode-btn active"
          onclick="setMode('two')"
        >
          👥 2 Players
        </button>
        <button id="btn-vs-cpu" class="mode-btn" onclick="setMode('cpu')">
          🤖 vs CPU
        </button>
      </div>

      <!-- Turn Indicator -->
      <div class="turn-banner" id="turn-banner">
        <span class="turn-icon" id="turn-icon">✕</span>
        <span class="turn-text" id="turn-text">Player X's Turn</span>
      </div>

      <!-- Game Board -->
      <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
        <!-- 9 cells generated by JS -->
      </div>

      <!-- Status Message (win / draw) -->
      <div class="status-message hidden" id="status-message">
        <span id="status-text"></span>
      </div>

      <!-- Scoreboard -->
      <div class="scoreboard">
        <div class="score-block x-score">
          <div class="score-label">X Wins</div>
          <div class="score-value" id="score-x">0</div>
        </div>
        <div class="score-block draw-score">
          <div class="score-label">Draws</div>
          <div class="score-value" id="score-draw">0</div>
        </div>
        <div class="score-block o-score">
          <div class="score-label">O Wins</div>
          <div class="score-value" id="score-o">0</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn-restart" id="btn-restart" onclick="restartGame()">
          ↺ New Game
        </button>
        <button class="btn-reset" id="btn-reset" onclick="resetScores()">
          ⊘ Reset Scores
        </button>
      </div>
    </main>

    <!-- Sound toggle (bottom corner) -->
    <button
      class="sound-toggle"
      id="sound-toggle"
      onclick="toggleSound()"
      title="Toggle Sound"
    >
      🔊
    </button>

    <script src="script.js"></script>
  </body>
</html>
